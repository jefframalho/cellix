<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cellix — Gestão para Lojas de Celular</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f17;--bg2:#101726;--card:#151c2b;--card2:#1c2539;--line:#26304a;--tx:#e8ecf4;--mut:#8b96ad;--pri:#22d3ee;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--vio:#a78bfa;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45}
a{color:var(--pri);cursor:pointer}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
select:disabled,input:disabled{opacity:.6}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:500}
h3{font-size:15px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:9px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:#04202a;border-color:var(--pri)}
.btn.pri:hover{background:#67e8f9}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#052e12}
.btn.bad{background:transparent;color:#f87171;border-color:#5b2330}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ghost{background:transparent}
.btn.big{width:100%;padding:13px;font-size:15px;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.x{background:none;border:0;color:var(--mut);font-size:22px;line-height:1;padding:0 6px}
.x:hover{color:var(--bad)}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 6px;font-weight:800;font-size:21px;letter-spacing:-.5px}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--vio));display:grid;place-items:center;color:#06121a}
.brand i svg{width:19px;height:19px}
.emp{font-size:12px;color:var(--mut);padding:0 8px 16px}
.nav{flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--card);color:var(--tx)}
.nav a.on{background:rgba(34,211,238,.12);color:var(--pri)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:12px 6px 0;margin-top:10px}
.side-foot div{flex:1;min-width:0}
.side-foot small{display:block;color:var(--mut);font-size:12px}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(11,15,23,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;flex:1;letter-spacing:-.3px}
.top select{width:auto;min-width:180px}
.main{padding:24px;max-width:1320px}
.banner{padding:9px 24px;background:rgba(245,158,11,.12);color:#fbbf24;font-weight:500;font-size:13px;border-bottom:1px solid #5a4210}
.banner.demo{background:rgba(167,139,250,.1);color:#c4b5fd;border-color:#3b3168}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.in{background:var(--bg2);padding:12px 14px}
.card.in b{display:block}
.kpi small{color:var(--mut);font-size:12px;font-weight:500}
.kpi b{display:block;font-size:23px;margin-top:6px;letter-spacing:-.5px}
.kpi span{font-size:12px;color:var(--mut)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td small{color:var(--mut);font-size:12px}
tr.click:hover td{background:var(--card2);cursor:pointer}
.r{text-align:right}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--card2);color:var(--mut);white-space:nowrap}
.tag.ok{background:rgba(34,197,94,.14);color:#4ade80}.tag.warn{background:rgba(245,158,11,.14);color:#fbbf24}.tag.bad{background:rgba(239,68,68,.14);color:#f87171}.tag.pri{background:rgba(34,211,238,.13);color:var(--pri)}.tag.vio{background:rgba(167,139,250,.14);color:#c4b5fd}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.mt{margin-top:12px}.mb{margin-bottom:14px}
.f{margin-bottom:12px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:12px}
.fg3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);margin-bottom:12px}
.full{grid-column:1/-1}
.mut{color:var(--mut)}
.sub{margin:18px 0 10px;font-size:14px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.empty{padding:36px;text-align:center;color:var(--mut)}
.empty h3{color:var(--tx)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx);margin:0;cursor:pointer}
.check input{width:auto;accent-color:var(--pri)}
.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:7px 13px;border-radius:99px;font-weight:600;font-size:12px}
.tabs button.on{background:rgba(34,211,238,.12);color:var(--pri);border-color:var(--pri)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;overflow:auto;z-index:50}
#m2 .modal-bg{z-index:60}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:580px;padding:22px}
.modal.wide{max-width:920px}
.modal h2{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--bg2)}
.res:hover{border-color:var(--pri)}
.res small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.pdv{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
.pdv td{padding:8px 6px}
.pdv td input{padding:6px 8px}
.tot{display:flex;justify-content:space-between;padding:5px 0}
.tot.big{font-size:21px;font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.pay{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.pay span{flex:1}
.bars{display:flex;gap:10px;height:170px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bar > div{width:100%;background:linear-gradient(180deg,var(--pri),#0e7490);border-radius:6px 6px 2px 2px;min-height:3px}
.bar small{color:var(--mut);font-size:11px}
.bar em{font-style:normal;font-size:10px;color:var(--mut)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,rgba(34,211,238,.12),transparent 40%),radial-gradient(circle at 80% 90%,rgba(167,139,250,.12),transparent 40%)}
.auth .card{width:100%;max-width:430px;padding:28px}
.demo-hint{margin-top:16px;font-size:12px;color:#c4b5fd;background:rgba(167,139,250,.08);border:1px solid #3b3168;border-radius:10px;padding:10px 12px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg2)}
.plan.on{border-color:var(--pri)}
.plan b{font-size:20px;display:block;margin:6px 0}
#qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;margin:8px 0}
#qr:empty{display:none}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-weight:600;z-index:99;transition:.25s;opacity:0;max-width:90vw}
#toast.show{transform:translateX(-50%);opacity:1}
#toast.ok{border-color:var(--ok)}#toast.bad{border-color:var(--bad)}#toast.warn{border-color:var(--warn)}
.menu-btn{display:none}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  body{background:#fff}
  #print-area{display:block;color:#000;font-family:Arial,sans-serif;font-size:12px;padding:6px}
  #print-area table{width:100%;border-collapse:collapse;margin:6px 0}
  #print-area th,#print-area td{border:1px solid #999;padding:4px 6px;color:#000;font-size:12px;text-transform:none;letter-spacing:0}
  #print-area h4{margin:10px 0 4px;font-size:13px}
  #print-area .ass{display:flex;gap:40px;margin-top:40px}
  #print-area .ass div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px}
}
@media(max-width:960px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:-270px;width:255px;z-index:40;transition:.2s}
  .side.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .menu-btn{display:inline-flex}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3,.g2,.pdv,.fg,.fg3,.plans{grid-template-columns:1fr}
  .main{padding:16px}.top{padding:12px 16px}
  .top select{min-width:0;max-width:150px}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>

  ],

};

/* ===================================================================== */
const DIA = 86400000;
const COLS = ['lojas','clientes','produtos','aparelhos','vendas','os','avaliacoes','caixas','movimentos','transferencias'];
const FORMAS = ['Dinheiro','Pix','Cartão de débito','Cartão de crédito','Outro'];
const STATUS_OS = ['Recebido','Em análise','Aguardando aprovação','Aprovado','Em reparo','Aguardando peça','Pronto','Entregue','Cancelado'];
const COR_OS = {'Recebido':'pri','Em análise':'vio','Aguardando aprovação':'warn','Aprovado':'pri','Em reparo':'vio','Aguardando peça':'warn','Pronto':'ok','Entregue':'','Cancelado':'bad'};
const CHECK_OS = ['Liga','Tela','Touch','Câmeras','Áudio / alto-falante','Microfone','Carregamento','Wi-Fi / sinal','Biometria / Face ID','Botões'];
const CHECK_AV = ['Tela sem trincas','Touch funcionando','Face ID / biometria','Câmeras','Alto-falante e microfone','Carregamento','Wi-Fi / Bluetooth / sinal','Botões','Carcaça sem amassados','Conta iCloud/Google desvinculada','IMEI sem restrição (consultado)'];
const PAPEL = {dono:'Dono',gerente:'Gerente',vendedor:'Vendedor',tecnico:'Técnico',super:'Administrador Cellix'};
const TODOS = ['dono','gerente','vendedor','tecnico'];
const GESTAO = ['dono','gerente'];
const MENU = [
  {id:'dashboard',nome:'Painel',ic:'dash',papeis:TODOS},
  {id:'pdv',nome:'Vender (PDV)',ic:'pdv',papeis:['dono','gerente','vendedor']},
  {id:'caixa',nome:'Caixa',ic:'caixa',papeis:['dono','gerente','vendedor']},
  {id:'vendas',nome:'Vendas',ic:'vendas',papeis:['dono','gerente','vendedor']},
  {id:'os',nome:'Ordens de serviço',ic:'os',papeis:TODOS},
  {id:'avaliacoes',nome:'Seminovos / troca',ic:'troca',papeis:['dono','gerente','vendedor']},
  {id:'aparelhos',nome:'Aparelhos (IMEI)',ic:'cel',papeis:TODOS},
  {id:'produtos',nome:'Acessórios e peças',ic:'box',papeis:TODOS},
  {id:'transferencias',nome:'Transferências',ic:'transf',papeis:GESTAO},
  {id:'clientes',nome:'Clientes',ic:'cli',papeis:TODOS},
  {id:'config',nome:'Lojas e equipe',ic:'cfg',papeis:GESTAO},
  {id:'assinatura',nome:'Assinatura',ic:'card',papeis:['dono']},
  {id:'admin',nome:'Admin Cellix',ic:'shield',super:true}
];
const IC = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  pdv:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  caixa:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
  vendas:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-5"/>',
  os:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
  troca:'<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  cel:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  transf:'<path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7"/>',
  cli:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  cfg:'<circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  card:'<rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  wa:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z"/>'
};
const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (+v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtN = v => (+v || 0).toFixed(2).replace('.', ',');
const num = v => { if (typeof v === 'number') return v; v = String(v || '').replace(/[^\d,.-]/g, ''); if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); return parseFloat(v) || 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const dt = ms => ms ? new Date(ms).toLocaleDateString('pt-BR') : '—';
const dth = ms => ms ? new Date(ms).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '—';
const pad = n => String(n || 0).padStart(4, '0');
const hoje0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const mes0 = () => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(1); return d.getTime(); };
const soma = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const apNome = a => [a.marca, a.modelo, a.armazenamento, a.cor].filter(Boolean).join(' ');
const optS = (arr, sel) => arr.map(s => `<option ${s === sel ? 'selected' : ''}>${esc(s)}</option>`).join('');
const opts = (arr, sel, lk = 'nome') => arr.map(x => `<option value="${esc(x.id)}" ${x.id === sel ? 'selected' : ''}>${esc(x[lk])}</option>`).join('');
const telWa = t => { let d = String(t || '').replace(/\D/g, ''); if (d.length === 10 || d.length === 11) d = '55' + d; return d; };
const abrirWa = (tel, msg) => window.open(`https://wa.me/${telWa(tel)}?text=${encodeURIComponent(msg)}`, '_blank');
function imeiValido(s){ s = String(s || '').replace(/\D/g,''); if (s.length !== 15) return false; let sum = 0; for (let i = 0; i < 15; i++){ let d = +s[i]; if (i % 2 === 1){ d *= 2; if (d > 9) d -= 9; } sum += d; } return sum % 10 === 0; }
function luhn14(s){ let sum = 0; for (let i = 0; i < 14; i++){ let d = +s[i]; if (i % 2 === 1){ d *= 2; if (d > 9) d -= 9; } sum += d; } return s + ((10 - sum % 10) % 10); }
function toast(m, t = 'ok'){ const el = $('#toast'); el.textContent = m; el.className = 'show ' + t; clearTimeout(toast.t); toast.t = setTimeout(() => el.className = '', 3200); }
function form(id){ const f = document.getElementById(id); const o = {}; new FormData(f).forEach((v, k) => o[k] = typeof v === 'string' ? v.trim() : v); f.querySelectorAll('input[type=checkbox]').forEach(c => o[c.name] = c.checked); return o; }
const Store = (() => { const mem = {}; return {
  get(k){ try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch(e){} return mem[k] ?? null; },
  set(k, v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
}; })();
const ERR = {'auth/invalid-credential':'E-mail ou senha incorretos','auth/wrong-password':'E-mail ou senha incorretos','auth/user-not-found':'E-mail ou senha incorretos','auth/email-already-in-use':'Este e-mail já tem cadastro','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres','auth/invalid-email':'E-mail inválido','permission-denied':'Sem permissão (assinatura bloqueada ou acesso negado)'};
const errMsg = e => ERR[e?.code] || e?.message || 'Erro inesperado';

/* ---------- Pix copia e cola (BR Code) ---------- */
function crc16(s){ let c = 0xFFFF; for (let i = 0; i < s.length; i++){ c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1); c &= 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
function pixPayload(valor, txid = 'CELLIX'){
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const n = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  const p = f('00','01') + f('26', f('00','br.gov.bcb.pix') + f('01', CONFIG.pix.chave)) + f('52','0000') + f('53','986') +
    (valor ? f('54', valor.toFixed(2)) : '') + f('58','BR') + f('59', n(CONFIG.pix.nome).slice(0,25)) + f('60', n(CONFIG.pix.cidade).slice(0,15)) +
    f('62', f('05', txid.replace(/[^A-Za-z0-9]/g,'').slice(0,25) || '***')) + '6304';
  return p + crc16(p);
}

const B = {};
function initBackend(){
  if (CONFIG.firebase && window.firebase){
    S.mode = 'firebase';

    const auth = firebase.auth(), fs = firebase.firestore();
    const mapa = s => s.docs.map(d => ({id:d.id, ...d.data()}));
    Object.assign(B, {
      onAuth(cb){ auth.onAuthStateChanged(u => { if (!S.cadastrando) cb(u ? {uid:u.uid, email:u.email} : null); }); },
      login: (e, s) => auth.signInWithEmailAndPassword(e, s),
      async signup(e, s){ const r = await auth.createUserWithEmailAndPassword(e, s); return r.user.uid; },
      logout: () => auth.signOut(),
      reset: e => auth.sendPasswordResetEmail(e),
      async criarConta(e, s){ const sec = firebase.apps.find(a => a.name === 'sec') || firebase.initializeApp(CONFIG.firebase, 'sec'); const r = await sec.auth().createUserWithEmailAndPassword(e, s); const id = r.user.uid; await sec.auth().signOut(); return id; },
      async get(p){ const d = await fs.doc(p).get(); return d.exists ? {id:d.id, ...d.data()} : null; },
      set: (p, v) => fs.doc(p).set(v),
      update: (p, v) => fs.doc(p).update(v),
      del: p => fs.doc(p).delete(),
      async list(c){ return mapa(await fs.collection(c).get()); },
      async where(c, f, v){ return mapa(await fs.collection(c).where(f, '==', v).get()); },
      watch(eid, cb){
        S.unsubs = COLS.map(col => fs.collection(`empresas/${eid}/${col}`).onSnapshot(s => { S.data[col] = mapa(s); cb(); }, err => console.warn(col, err)));
        S.unsubs.push(fs.doc('empresas/' + eid).onSnapshot(d => { if (d.exists){ S.empresa = {id:d.id, ...d.data()}; cb(); } }));
      }
    });
  } else {
    S.mode = 'demo';
    CONFIG.superadmins = [...CONFIG.superadmins, 'admin@cellix.com'];
    const DK = 'cellix_demo_v1';
    let DB = Store.get(DK); if (!DB){ DB = seed(); Store.set(DK, DB); }
    const persist = () => Store.set(DK, DB);
    let authCb = () => {};
    const conta = e => DB.contas.find(x => x.email === e);
    Object.assign(B, {
      onAuth(cb){ authCb = cb; const s = Store.get('cellix_sess'); const c = s && DB.contas.find(x => x.uid === s); cb(c ? {uid:c.uid, email:c.email} : null); },
      async login(e, s){ const c = conta(e.toLowerCase()); if (!c || c.senha !== s) throw {code:'auth/invalid-credential'}; Store.set('cellix_sess', c.uid); authCb({uid:c.uid, email:c.email}); },
      async signup(e, s){ e = e.toLowerCase(); if (conta(e)) throw {code:'auth/email-already-in-use'}; if (s.length < 6) throw {code:'auth/weak-password'}; const id = uid(); DB.contas.push({uid:id, email:e, senha:s}); persist(); Store.set('cellix_sess', id); return id; },
      logout(){ Store.set('cellix_sess', null); authCb(null); },
      async reset(){ toast('No modo demonstração não há envio de e-mail', 'warn'); },
      async criarConta(e, s){ e = e.toLowerCase(); if (conta(e)) throw {code:'auth/email-already-in-use'}; if (s.length < 6) throw {code:'auth/weak-password'}; const id = uid(); DB.contas.push({uid:id, email:e, senha:s}); persist(); return id; },
      async get(p){ const v = DB.docs[p]; return v ? {...clone(v), id:p.split('/').pop()} : null; },
      async set(p, v){ DB.docs[p] = clone(v); persist(); },
      async update(p, v){ DB.docs[p] = {...(DB.docs[p] || {}), ...clone(v)}; persist(); },
      async del(p){ delete DB.docs[p]; persist(); },
      async list(c){ const n = c.split('/').length + 1; return Object.keys(DB.docs).filter(k => k.startsWith(c + '/') && k.split('/').length === n).map(k => ({...clone(DB.docs[k]), id:k.split('/').pop()})); },
      async where(c, f, v){ return (await B.list(c)).filter(x => x[f] === v); },
      async watch(eid, cb){ for (const col of COLS) S.data[col] = await B.list(`empresas/${eid}/${col}`); cb(); },
      resetDemo(){ DB = seed(); persist(); Store.set('cellix_sess', null); location.reload(); }
    });
  }
}

async function save(col, obj){
  obj = clone(obj);
  if (!obj.id) obj.id = uid();
  if (!obj.criadoEm) obj.criadoEm = Date.now();
  obj.atualizadoEm = Date.now();
  const arr = S.data[col] || (S.data[col] = []);
  const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  try { await B.set(`empresas/${S.empresa.id}/${col}/${obj.id}`, obj); }
  catch(e){ toast(errMsg(e), 'bad'); throw e; }
  return obj;
}
async function apagar(col, id){
  S.data[col] = D(col).filter(x => x.id !== id);
  await B.del(`empresas/${S.empresa.id}/${col}/${id}`);
}

async function entrar(u){
  S.unsubs?.forEach(f => f()); S.unsubs = null;
  if (!u){ Object.assign(S, {user:null, perfil:null, empresa:null, data:{}, cart:null, lojaId:null}); closeModal(1); closeModal(2); return renderAuth(); }
  S.user = u;
  S.isSuper = CONFIG.superadmins.includes((u.email || '').toLowerCase());
  $('#app').innerHTML = '<div class="auth"><div class="mut">Carregando…</div></div>';
  try {
    const perfil = await B.get('usuarios/' + u.uid);
    if (!perfil){
      if (S.isSuper){ S.perfil = {nome:'Administrador', papel:'super'}; S.empresa = null; S.view = 'admin'; return render(); }
      return renderSemPerfil();
    }
    if (perfil.ativo === false){ toast('Seu usuário foi desativado. Fale com o responsável.', 'bad'); return B.logout(); }
    S.perfil = perfil;
    S.empresa = await B.get('empresas/' + perfil.empresaId);
    S.data.usuarios = await B.where('usuarios', 'empresaId', perfil.empresaId);
    await B.watch(perfil.empresaId, scheduleRender);
    if (perfil.papel === 'tecnico') S.view = 'os';
    render();
  } catch(e){ console.error(e); toast(errMsg(e), 'bad'); renderSemPerfil(errMsg(e)); }
}

function estadoAssinatura(){
  const e = S.empresa; if (!e) return {};
  const now = Date.now(), tol = CONFIG.toleranciaDias * DIA, dias = Math.ceil((e.vencimento - now) / DIA);
  if (e.status === 'bloqueado') return {bloqueada:true, motivo:'Acesso bloqueado'};
  if (now > e.vencimento + tol) return {bloqueada:true, motivo:'Assinatura vencida'};
  if (now > e.vencimento) return {aviso:`Sua assinatura venceu em ${dt(e.vencimento)}. O acesso será bloqueado em ${Math.ceil((e.vencimento + tol - now) / DIA)} dia(s).`};
  if (dias <= 5) return {aviso:`Sua assinatura vence em ${dias} dia(s) (${dt(e.vencimento)}).`};
  return {};
}

    <div class="card kpi"><small>Ordens de serviço abertas</small><b>${abertas.length}</b><span>${prontas.length} pronta(s) p/ retirar · ${brl(osMes)} no mês</span></div>
    <div class="card kpi"><small>Aparelhos em estoque</small><b>${aps.length}</b><span>${gestor ? 'custo ' + brl(soma(aps, a => a.custo)) + ' · ' : ''}venda ${brl(soma(aps, a => a.preco))}</span></div>
  </div>
  <div class="grid g2 mb">

    <div class="card"><div class="row mb"><h3>OS prontas e aguardando aprovação</h3><span class="sp"></span><a onclick="go('os')">ver todas</a></div>
      ${os.filter(o => ['Pronto','Aguardando aprovação'].includes(o.status)).slice(0, 6).map(o => `<div class="res" onclick="osDetalhe('${o.id}')"><div><b>#${pad(o.numero)} · ${esc(apNome(o))}</b><small>${esc(cliNome(o.clienteId))} · ${esc(lojaNome(o.lojaId))}</small></div>${tagOS(o.status)}</div>`).join('') || '<div class="empty">Nenhuma no momento.</div>'}</div>

VIEWS.pdv = () => {
  if (S.lojaId === '*') return main(selLojaMsg());
  if (!caixaAberto()) return main(`<div class="card empty"><h3>O caixa da ${esc(lojaNome(S.lojaId))} está fechado</h3><p class="mt mb">Abra o caixa para começar a vender.</p><button class="btn pri" onclick="go('caixa')">Abrir caixa</button></div>`);
  if (!S.cart) S.cart = novoCarrinho();
  main(`<div class="pdv"><div class="card"><div class="f"><label>Buscar acessório, modelo ou IMEI (o leitor de código de barras funciona aqui)</label>
    <input id="pdv-q" placeholder="Ex.: película, iPhone 13, 3569…" oninput="pdvBusca(this.value)" onkeydown="if(event.key==='Enter')pdvEnter(this.value)"></div><div id="pdv-res"></div></div>
    <div class="card" id="pdv-cart"></div></div>`);
  pdvBusca(''); renderCart(); setTimeout(() => $('#pdv-q')?.focus(), 30);
};
function pdvBusca(q){
  q = q.trim().toLowerCase(); const L = S.lojaId;
  const fora = id => !S.cart.itens.some(i => i.refId === id);
  let aps = D('aparelhos').filter(a => a.lojaId === L && a.status === 'disponivel' && fora(a.id));
  let prs = D('produtos').filter(p => p.ativo !== false && p.categoria !== 'Peça' && (p.estoque?.[L] || 0) > 0);
  if (q){ aps = aps.filter(a => (a.imei + ' ' + (a.imei2 || '') + ' ' + apNome(a)).toLowerCase().includes(q)); prs = prs.filter(p => (p.nome + ' ' + (p.codigo || '')).toLowerCase().includes(q)); }
  const html = [...aps.slice(0, 8).map(a => `<div class="res" onclick="addAparelho('${a.id}')"><div><b>${esc(apNome(a))}</b><small>IMEI ${esc(a.imei)} · ${a.condicao === 'seminovo' ? 'Seminovo' : 'Novo'}${a.bateria ? ' · bateria ' + a.bateria + '%' : ''}</small></div><b>${brl(a.preco)}</b></div>`),
    ...prs.slice(0, 12).map(p => `<div class="res" onclick="addProduto('${p.id}')"><div><b>${esc(p.nome)}</b><small>${p.codigo ? esc(p.codigo) + ' · ' : ''}${p.estoque[L]} em estoque</small></div><b>${brl(p.preco)}</b></div>`)].join('');
  $('#pdv-res').innerHTML = html || '<div class="empty">Nada encontrado nesta loja.</div>';
}
function pdvEnter(q){
  q = q.trim(); if (!q) return; const L = S.lojaId;
  const a = D('aparelhos').find(a => a.lojaId === L && a.status === 'disponivel' && (a.imei === q || a.imei2 === q));
  const p = !a && D('produtos').find(p => p.codigo && p.codigo === q);
  if (a) addAparelho(a.id); else if (p) addProduto(p.id); else return;
  $('#pdv-q').value = ''; pdvBusca('');
}
function addAparelho(id){ const a = byId('aparelhos', id); if (S.cart.itens.some(i => i.refId === id)) return; S.cart.itens.push({tipo:'aparelho', refId:id, descricao:apNome(a), imei:a.imei, condicao:a.condicao, qtd:1, preco:a.preco, custo:a.custo}); renderCart(); pdvBusca($('#pdv-q')?.value || ''); }
function addProduto(id){
  const p = byId('produtos', id), est = p.estoque?.[S.lojaId] || 0, it = S.cart.itens.find(i => i.refId === id);
  if (it){ if (it.qtd >= est) return toast('Estoque insuficiente', 'warn'); it.qtd++; }
  else S.cart.itens.push({tipo:'produto', refId:id, descricao:p.nome, qtd:1, preco:p.preco, custo:p.custo, categoria:p.categoria});
  renderCart();
}
function cartTotais(){ const c = S.cart; const sub = soma(c.itens, i => i.preco * i.qtd); const total = Math.max(0, sub - (+c.desconto || 0)); const pago = (c.troca?.valor || 0) + soma(c.pagamentos, p => p.valor); return {sub, total, pago, falta:Math.max(0, total - pago), troco:Math.max(0, pago - total)}; }
function cartQtd(k, v){ const i = S.cart.itens[k], est = byId('produtos', i.refId)?.estoque?.[S.lojaId] || 0; v = Math.max(1, parseInt(v) || 1); if (v > est){ toast('Só há ' + est + ' em estoque', 'warn'); v = est; } i.qtd = v; renderCart(); }
function cartPreco(k, v){ S.cart.itens[k].preco = num(v); renderCart(); }
function cartRem(k){ S.cart.itens.splice(k, 1); renderCart(); pdvBusca($('#pdv-q')?.value || ''); }
function renderCart(){
  const c = S.cart, t = cartTotais();
  $('#pdv-cart').innerHTML = `<div class="row mb"><h3>Venda atual</h3><span class="sp"></span>${c.itens.length || c.pagamentos.length ? '<button class="btn sm ghost" onclick="S.cart=novoCarrinho();renderCart();pdvBusca(\'\')">Limpar</button>' : ''}</div>
  ${c.itens.length ? `<div class="tw"><table><tbody>${c.itens.map((i, k) => `<tr><td><b>${esc(i.descricao)}</b>${i.imei ? `<br><small>IMEI ${esc(i.imei)}</small>` : ''}</td>

    <td style="width:105px"><input value="${fmtN(i.preco)}" onchange="cartPreco(${k},this.value)"></td><td style="width:30px"><button class="x" onclick="cartRem(${k})">×</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Toque nos itens à esquerda para adicionar.</div>'}
  <div class="fg mt"><div><label>Cliente</label><div class="row nw"><select id="cart-cli" onchange="S.cart.clienteId=this.value"><option value="">Consumidor final</option>${opts(cliList(), c.clienteId)}</select><button class="btn sm" title="Novo cliente" onclick="clienteModal(null,x=>{S.cart.clienteId=x.id;renderCart()})">+</button></div></div>

  ${c.desconto ? `<div class="tot"><span class="mut">Desconto</span><span>- ${brl(c.desconto)}</span></div>` : ''}
  <div class="tot big"><span>Total</span><span>${brl(t.total)}</span></div>
  ${c.troca ? `<div class="pay"><span>${ico('troca').replace('<svg','<svg width="16" height="16"')} Troca: ${esc(c.troca.descricao)}</span><b>${brl(c.troca.valor)}</b><button class="x" onclick="S.cart.troca=null;renderCart()">×</button></div>` : `<button class="btn sm mt" onclick="escolherTroca()">Usar aparelho do cliente na troca</button>`}
  ${c.pagamentos.map((p, k) => `<div class="pay"><span>${esc(p.forma)}${p.parcelas > 1 ? ' ' + p.parcelas + 'x' : ''}</span><b>${brl(p.valor)}</b><button class="x" onclick="S.cart.pagamentos.splice(${k},1);renderCart()">×</button></div>`).join('')}
  ${t.falta > 0.004 ? `<div class="row nw mt"><select id="pg-forma" onchange="$('#pg-parc').style.display=this.value==='Cartão de crédito'?'':'none'">${optS(FORMAS)}</select>
    <select id="pg-parc" style="display:none;width:80px">${[...Array(12)].map((_, k) => `<option value="${k + 1}">${k + 1}x</option>`).join('')}</select>
    <input id="pg-valor" value="${fmtN(t.falta)}" style="width:110px" onkeydown="if(event.key==='Enter')addPagamento()"><button class="btn" onclick="addPagamento()">+</button></div>` : ''}
  <div class="tot mt"><span class="mut">${t.troco > 0 ? 'Troco' : 'Falta receber'}</span><b style="color:${t.troco > 0 ? 'var(--ok)' : t.falta > 0 ? 'var(--warn)' : 'var(--ok)'}">${brl(t.troco > 0 ? t.troco : t.falta)}</b></div>
  <button class="btn pri big" onclick="finalizarVenda(this)" ${!c.itens.length || t.falta > 0.004 ? 'disabled' : ''}>Finalizar venda</button>`;

function addPagamento(){ const v = num($('#pg-valor').value); if (v <= 0) return; const forma = $('#pg-forma').value; S.cart.pagamentos.push({forma, valor:v, parcelas:forma === 'Cartão de crédito' ? +$('#pg-parc').value : 1}); renderCart(); }
function escolherTroca(){

async function finalizarVenda(btn){
  const c = S.cart, t = cartTotais(), L = S.lojaId, cx = caixaAberto();
  if (!c.itens.length || t.falta > 0.004) return;
  if (!cx) return toast('Caixa fechado', 'bad');

  try {
    const now = Date.now();
    let troca = null;
    if (c.troca){
      const av = byId('avaliacoes', c.troca.avaliacaoId);
      const ap = await save('aparelhos', {marca:av.marca, modelo:av.modelo, armazenamento:av.armazenamento, cor:av.cor, imei:av.imei, condicao:'seminovo', bateria:av.bateria, custo:+av.valorOferecido || 0, preco:+av.valorVenda || 0, lojaId:L, status:'disponivel', origem:'troca', avaliacaoId:av.id, obs:av.obs || ''});
      await save('avaliacoes', {...av, status:'usada', aparelhoId:ap.id, usadaEm:now});
      troca = {...c.troca, aparelhoId:ap.id};
    }
    const venda = await save('vendas', {numero:prox('vendas'), lojaId:L, caixaId:cx.id, vendedorId:S.user.uid, clienteId:c.clienteId || '', itens:c.itens, subtotal:t.sub, desconto:+c.desconto || 0, total:t.total, troca, pagamentos:c.pagamentos, troco:t.troco, data:now, status:'concluida'});
    for (const i of c.itens){
      if (i.tipo === 'aparelho'){ const a = byId('aparelhos', i.refId); await save('aparelhos', {...a, status:'vendido', vendaId:venda.id, vendidoEm:now}); }

    S.cart = novoCarrinho();
    render();
    vendaConcluida(venda);
  } catch(e){ console.error(e); btn.disabled = false; }
}

function resumoCaixa(cx){
  const formas = {}; let trocos = 0;
  D('vendas').filter(v => v.caixaId === cx.id && v.status !== 'cancelada').forEach(v => { v.pagamentos.forEach(p => formas[p.forma] = (formas[p.forma] || 0) + p.valor); trocos += v.troco || 0; });
  let osRec = 0;
  D('os').forEach(o => (o.pagamentos || []).filter(p => p.caixaId === cx.id).forEach(p => { formas[p.forma] = (formas[p.forma] || 0) + p.valor; osRec += p.valor; }));
  const movs = D('movimentos').filter(m => m.caixaId === cx.id);
  const sup = soma(movs.filter(m => m.tipo === 'suprimento'), m => m.valor), saidas = soma(movs.filter(m => m.tipo !== 'suprimento'), m => m.valor);
  const dinheiro = (+cx.valorInicial || 0) + (formas['Dinheiro'] || 0) - trocos + sup - saidas;
  return {formas, trocos, sup, saidas, osRec, dinheiro, totalEntradas:soma(Object.values(formas), x => x) - trocos, movs};
}
VIEWS.caixa = () => {
  if (S.lojaId === '*') return main(selLojaMsg());
  const cx = caixaAberto();
  const hist = D('caixas').filter(c => c.lojaId === S.lojaId && c.status === 'fechado').sort((a, b) => b.fechadoEm - a.fechadoEm).slice(0, 15);

  if (!cx) return main(`<div class="card" style="max-width:440px"><h3>Abrir caixa — ${esc(lojaNome(S.lojaId))}</h3><p class="mut mt mb">Informe o dinheiro que já está na gaveta (troco inicial).</p><label>Valor inicial (R$)</label><input id="cx-ini" value="0,00"><button class="btn pri big" onclick="abrirCaixa(this)">Abrir caixa</button></div>${histHtml}`);

    <div class="card kpi"><small>Dinheiro esperado na gaveta</small><b>${brl(r.dinheiro)}</b><span>inicial ${brl(cx.valorInicial)}</span></div>
    ${FORMAS.filter(f => f !== 'Dinheiro').slice(0, 3).map(f => `<div class="card kpi"><small>${f}</small><b>${brl(r.formas[f] || 0)}</b></div>`).join('')}
  </div>
  <div class="grid g2"><div class="card"><h3 class="mb">Resumo</h3>
    ${Object.entries(r.formas).map(([f, v]) => `<div class="tot"><span class="mut">${esc(f)}</span><span>${brl(v)}</span></div>`).join('') || '<p class="mut">Nenhum recebimento ainda.</p>'}
    <div class="tot"><span class="mut">Trocos devolvidos</span><span>- ${brl(r.trocos)}</span></div>
    <div class="tot"><span class="mut">Recebido de OS</span><span>${brl(r.osRec)}</span></div>
    <div class="tot"><span class="mut">Suprimentos</span><span>${brl(r.sup)}</span></div>
    <div class="tot"><span class="mut">Sangrias / compras de seminovos</span><span>- ${brl(r.saidas)}</span></div>
    <div class="tot big"><span>Entradas</span><span>${brl(r.totalEntradas)}</span></div></div>
  <div class="card"><h3 class="mb">Movimentações</h3><div class="tw"><table><tbody>${r.movs.sort((a, b) => b.data - a.data).map(m => `<tr><td><span class="tag ${m.tipo === 'suprimento' ? 'ok' : 'warn'}">${m.tipo === 'suprimento' ? 'Suprimento' : m.tipo === 'sangria' ? 'Sangria' : 'Compra seminovo'}</span></td><td>${esc(m.motivo)}<br><small>${dth(m.data)} · ${esc(userNome(m.por))}</small></td><td class="r">${brl(m.valor)}</td></tr>`).join('') || '<tr><td class="empty">Nenhuma movimentação.</td></tr>'}</tbody></table></div></div></div>${histHtml}`);
};
async function abrirCaixa(btn){ if (precisaLoja() || caixaAberto()) return; btn.disabled = true; try { await save('caixas', {lojaId:S.lojaId, status:'aberto', valorInicial:num($('#cx-ini').value), abertoPor:S.user.uid, abertoEm:Date.now()}); toast('Caixa aberto'); render(); } catch(e){ btn.disabled = false; } }
function movCaixa(tipo){
  openModal(tipo === 'suprimento' ? 'Suprimento (entrada de dinheiro)' : 'Sangria (retirada de dinheiro)', `<form id="f-mov" onsubmit="event.preventDefault();salvarMov('${tipo}')"><div class="f"><label>Valor (R$)</label><input name="valor" required></div><div class="f"><label>Motivo</label><input name="motivo" placeholder="${tipo === 'sangria' ? 'Ex.: depósito no banco, pagamento de fornecedor' : 'Ex.: reforço de troco'}" required></div><button class="btn pri big">Salvar</button></form>`);
}
async function salvarMov(tipo){ const f = form('f-mov'), cx = caixaAberto(); if (!cx || num(f.valor) <= 0) return; await save('movimentos', {caixaId:cx.id, lojaId:S.lojaId, tipo, valor:num(f.valor), motivo:f.motivo, por:S.user.uid, data:Date.now()}); closeModal(); toast('Movimentação registrada'); render(); }
function fecharCaixaModal(){
  const cx = caixaAberto(), r = resumoCaixa(cx);
  openModal('Fechar caixa', `<p class="mut mb">Conte o dinheiro da gaveta e informe abaixo. Cartões e Pix são conferidos pelo extrato.</p>
  <div class="tot"><span>Dinheiro esperado</span><b>${brl(r.dinheiro)}</b></div>
  <div class="f mt"><label>Dinheiro contado (R$)</label><input id="cx-cont" value="${fmtN(r.dinheiro)}" oninput="$('#cx-dif').textContent=brl(num(this.value)-${r.dinheiro})"></div>
  <div class="tot"><span>Diferença</span><b id="cx-dif">${brl(0)}</b></div>
  <div class="f mt"><label>Observação</label><input id="cx-obs"></div>
  <button class="btn pri big" onclick="fecharCaixa(this)">Fechar e imprimir</button>`);
}
async function fecharCaixa(btn){
  const cx = caixaAberto(); if (!cx) return; btn.disabled = true;
  const r = resumoCaixa(cx), contado = num($('#cx-cont').value); delete r.movs;
  const fechado = await save('caixas', {...cx, status:'fechado', fechadoEm:Date.now(), fechadoPor:S.user.uid, resumo:r, contado, diferenca:+(contado - r.dinheiro).toFixed(2), obs:$('#cx-obs').value});
  closeModal(); toast('Caixa fechado'); render(); printCaixa(fechado);
}
function printCaixa(c){
  const r = c.resumo || resumoCaixa(c);
  printDoc(cab(c.lojaId, 'Fechamento de caixa') + `<p>Aberto por ${esc(userNome(c.abertoPor))} em ${dth(c.abertoEm)}<br>Fechado por ${esc(userNome(c.fechadoPor))} em ${dth(c.fechadoEm)}</p>
  <table><tbody><tr><td>Valor inicial</td><td>${brl(c.valorInicial)}</td></tr>${Object.entries(r.formas).map(([f, v]) => `<tr><td>${esc(f)}</td><td>${brl(v)}</td></tr>`).join('')}<tr><td>Trocos</td><td>- ${brl(r.trocos)}</td></tr><tr><td>Suprimentos</td><td>${brl(r.sup)}</td></tr><tr><td>Sangrias / compras</td><td>- ${brl(r.saidas)}</td></tr>
  <tr><td><b>Dinheiro esperado</b></td><td><b>${brl(r.dinheiro)}</b></td></tr><tr><td><b>Dinheiro contado</b></td><td><b>${brl(c.contado)}</b></td></tr><tr><td><b>Diferença</b></td><td><b>${brl(c.diferenca)}</b></td></tr></tbody></table>
  ${c.obs ? '<p>Obs.: ' + esc(c.obs) + '</p>' : ''}<div class="ass"><div>Operador</div><div>Gerente</div></div>`);
}

VIEWS.vendas = () => {
  const f = S.f.v || (S.f.v = {per:'mes', q:''});
  const ini = {hoje:hoje0(), '7d':hoje0() - 6 * DIA, mes:mes0(), todas:0}[f.per];
  const q = f.q.toLowerCase();
  const lista = D('vendas').filter(v => naLoja(v) && v.data >= ini && (!q || String(v.numero).includes(q) || cliNome(v.clienteId).toLowerCase().includes(q) || v.itens.some(i => (i.descricao + ' ' + (i.imei || '')).toLowerCase().includes(q)))).sort((a, b) => b.data - a.data);
  const ok = lista.filter(v => v.status !== 'cancelada');
  main(`<div class="row mb"><div class="tabs" style="margin:0">${[['hoje','Hoje'],['7d','7 dias'],['mes','Este mês'],['todas','Todas']].map(([k, n]) => `<button class="${f.per === k ? 'on' : ''}" onclick="S.f.v.per='${k}';render()">${n}</button>`).join('')}</div><span class="sp"></span>
  <input style="max-width:280px" placeholder="Buscar nº, cliente, produto, IMEI" value="${esc(f.q)}" onchange="S.f.v.q=this.value;render()"></div>
  <div class="grid g3 mb"><div class="card kpi"><small>Faturamento</small><b>${brl(soma(ok, v => v.total))}</b></div><div class="card kpi"><small>Vendas</small><b>${ok.length}</b></div><div class="card kpi"><small>Ticket médio</small><b>${brl(ok.length ? soma(ok, v => v.total) / ok.length : 0)}</b></div></div>
  <div class="card tw"><table><thead><tr><th>Nº</th><th>Data</th><th>Loja</th><th>Cliente</th><th>Itens</th><th>Vendedor</th><th class="r">Total</th><th></th></tr></thead><tbody>
  ${lista.map(v => `<tr class="click" onclick="vendaDetalhe('${v.id}')"><td>#${pad(v.numero)}</td><td>${dth(v.data)}</td><td>${esc(lojaNome(v.lojaId))}</td><td>${esc(cliNome(v.clienteId))}</td><td><small>${esc(v.itens.map(i => i.descricao).join(', ').slice(0, 60))}</small></td><td>${esc(userNome(v.vendedorId))}</td><td class="r"><b>${brl(v.total)}</b></td><td>${v.status === 'cancelada' ? '<span class="tag bad">Cancelada</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">Nenhuma venda no período.</td></tr>'}</tbody></table></div>`);
};
function vendaDetalhe(id){
  const v = byId('vendas', id);
  openModal(`Venda #${pad(v.numero)} ${v.status === 'cancelada' ? '<span class="tag bad">Cancelada</span>' : ''}`, `<p class="mut mb">${dth(v.data)} · ${esc(lojaNome(v.lojaId))} · vendedor ${esc(userNome(v.vendedorId))} · cliente ${esc(cliNome(v.clienteId))}</p>
  <div class="tw"><table><tbody>${v.itens.map(i => `<tr><td>${i.qtd}x ${esc(i.descricao)}${i.imei ? '<br><small>IMEI ' + esc(i.imei) + '</small>' : ''}</td><td class="r">${brl(i.preco * i.qtd)}</td></tr>`).join('')}</tbody></table></div>
  ${v.desconto ? `<div class="tot"><span class="mut">Desconto</span><span>- ${brl(v.desconto)}</span></div>` : ''}<div class="tot big"><span>Total</span><span>${brl(v.total)}</span></div>
  ${v.troca ? `<div class="pay"><span>Troca: ${esc(v.troca.descricao)}</span><b>${brl(v.troca.valor)}</b></div>` : ''}${v.pagamentos.map(p => `<div class="pay"><span>${esc(p.forma)}${p.parcelas > 1 ? ' ' + p.parcelas + 'x' : ''}</span><b>${brl(p.valor)}</b></div>`).join('')}
  ${v.status === 'cancelada' ? `<p class="mt" style="color:#f87171">Cancelada em ${dth(v.canceladaEm)} por ${esc(userNome(v.canceladaPor))}: ${esc(v.motivoCancelamento || '')}</p>` : ''}
  <div class="row mt"><button class="btn" onclick="printVenda(byId('vendas','${v.id}'))">${ico('print')} Recibo</button>${byId('clientes', v.clienteId)?.telefone ? `<button class="btn" onclick="whatsVenda('${v.id}')">${ico('wa')} WhatsApp</button>` : ''}<span class="sp"></span>${v.status !== 'cancelada' && pode(GESTAO) ? `<button class="btn bad" onclick="cancelarVenda('${v.id}')">Cancelar venda</button>` : ''}</div>`);
}
async function cancelarVenda(id){
  const v = byId('vendas', id); const motivo = prompt('Motivo do cancelamento (os itens voltam para o estoque):'); if (motivo === null) return;
  for (const i of v.itens){
    if (i.tipo === 'aparelho'){ const a = byId('aparelhos', i.refId); if (a && a.vendaId === v.id) await save('aparelhos', {...a, status:'disponivel', vendaId:null, vendidoEm:null}); }
    else { const p = byId('produtos', i.refId); if (p) await save('produtos', {...p, estoque:{...p.estoque, [v.lojaId]:(p.estoque?.[v.lojaId] || 0) + i.qtd}}); }
  }
  await save('vendas', {...v, status:'cancelada', canceladaEm:Date.now(), canceladaPor:S.user.uid, motivoCancelamento:motivo});
  closeModal(); toast('Venda cancelada e estoque devolvido'); render();
}

};
const tecnicos = () => D('usuarios').filter(u => u.ativo !== false && ['tecnico','dono','gerente'].includes(u.papel));

async function salvarNovaOS(btn){

function osCapture(){
  const o = S.osEdit, g = id => document.getElementById(id);
  if (!g('os-laudo') || g('os-laudo').disabled) return;
  o.laudo = g('os-laudo').value; o.maoDeObra = num(g('os-mao').value); o.desconto = num(g('os-descon').value); o.garantiaDias = parseInt(g('os-gar').value) || 0; o.tecnicoId = g('os-tec').value;
  const st = g('os-status').value; if (st !== o.status){ o.status = st; o.historico = [...(o.historico || []), {status:st, data:Date.now(), por:S.user.uid}]; }
}
function osAddPeca(){ const id = $('#os-peca').value; if (!id) return; const p = byId('produtos', id); osCapture(); S.osEdit.itens.push({descricao:p.nome, valor:p.preco, custo:p.custo, produtoId:p.id}); renderOSBody(); }
function osAddItem(){ const d = $('#os-desc').value.trim(), v = num($('#os-val').value); if (!d) return; osCapture(); S.osEdit.itens.push({descricao:d, valor:v}); renderOSBody(); }
async function osSalvar(){ osCapture(); await save('os', S.osEdit); toast('OS salva'); renderOSBody(); scheduleRender(); }
async function osReceber(entregar, btn){
  osCapture(); const o = S.osEdit, valor = num($('#os-pgval').value), t = osTot(o), pago = soma(o.pagamentos || [], p => p.valor);
  if (valor > 0){
    const cx = caixaAberto(o.lojaId); if (!cx) return toast('Abra o caixa da ' + lojaNome(o.lojaId) + ' para receber', 'warn');
    o.pagamentos = [...(o.pagamentos || []), {forma:$('#os-forma').value, valor, data:Date.now(), caixaId:cx.id, por:S.user.uid}];
  } else if (!entregar) return;
  if (entregar){
    if (pago + valor < t - 0.004 && !confirm(`Ainda falta receber ${brl(t - pago - valor)}. Entregar mesmo assim?`)){ if (valor > 0) o.pagamentos.pop(); return; }
    o.status = 'Entregue'; o.entregueEm = Date.now(); o.garantiaAte = Date.now() + (o.garantiaDias || 0) * DIA;
    o.historico = [...(o.historico || []), {status:'Entregue', data:Date.now(), por:S.user.uid}];
    if (!o.estoqueBaixado){ for (const i of o.itens.filter(i => i.produtoId)){ const p = byId('produtos', i.produtoId); if (p) await save('produtos', {...p, estoque:{...p.estoque, [o.lojaId]:(p.estoque?.[o.lojaId] || 0) - 1}}); } o.estoqueBaixado = true; }
  }
  btn.disabled = true;
  await save('os', o); toast(entregar ? 'OS entregue' : 'Pagamento registrado'); renderOSBody(); scheduleRender();
  if (entregar) printOS(o, 'entrega');
}
async function osCancelar(){ if (!confirm('Cancelar esta OS?')) return; const o = S.osEdit; o.status = 'Cancelado'; o.historico = [...(o.historico || []), {status:'Cancelado', data:Date.now(), por:S.user.uid}]; await save('os', o); toast('OS cancelada'); renderOSBody(); scheduleRender(); }
function osWhats(){
  const o = S.osEdit, cli = byId('clientes', o.clienteId) || {}; if (!cli.telefone) return toast('Cliente sem telefone cadastrado', 'warn');

  abrirWa(cli.telefone, `Olá ${(cli.nome || '').split(' ')[0]}! Aqui é da ${S.empresa.nome} (${lojaNome(o.lojaId)}).\nOrdem de serviço nº ${pad(o.numero)} — ${apNome(o)}\nStatus: *${o.status}*${extra}`);

  ${(o.itens || []).length || o.maoDeObra ? `<h4>${tipo === 'entrada' ? 'Orçamento' : 'Valores'}</h4><table><tbody>${(o.itens || []).map(i => `<tr><td>${esc(i.descricao)}</td><td style="width:120px">${brl(i.valor)}</td></tr>`).join('')}${o.maoDeObra ? `<tr><td>Mão de obra</td><td>${brl(o.maoDeObra)}</td></tr>` : ''}${o.desconto ? `<tr><td>Desconto</td><td>- ${brl(o.desconto)}</td></tr>` : ''}<tr><td><b>Total</b></td><td><b>${brl(t)}</b></td></tr></tbody></table>` : ''}
  ${tipo === 'entrega' ? `<p><b>Pago:</b> ${(o.pagamentos || []).map(p => esc(p.forma) + ' ' + brl(p.valor)).join(', ') || '—'}<br><b>Entregue em:</b> ${dth(o.entregueEm)} · <b>Garantia de ${o.garantiaDias} dias, até ${dt(o.garantiaAte)}</b> (somente para o serviço/peça trocada; não cobre queda, líquidos, mau uso ou violação).</p>`
  : `<p style="font-size:11px;margin-top:8px">${esc(c.termoOS || 'O cliente autoriza a análise do aparelho. Aparelhos não retirados em até 90 dias após o aviso de conclusão poderão ser descartados ou vendidos para cobrir custos (art. 1.275 do Código Civil). A loja não se responsabiliza por dados, chips e cartões de memória deixados no aparelho. Defeitos não relatados podem surgir durante o reparo de aparelhos com sinais de queda ou contato com líquidos.')}</p>`}
  <div class="ass"><div>Cliente</div><div>${esc(S.empresa.nome)}</div></div>`);
}

async function salvarAv(finalidade, btn){
  const f = form('f-av'); if (!f.clienteId) return toast('Selecione o cliente', 'warn');

async function salvarProduto(id){

  main(`<div class="row mb"><button class="btn pri" onclick="novaTransf()" ${D('lojas').length < 2 ? 'disabled title="Cadastre pelo menos 2 lojas"' : ''}>+ Nova transferência</button><span class="mut">Envie aparelhos e acessórios de uma loja para outra. O estoque só entra no destino quando a loja confirmar o recebimento.</span></div>

  ${lista.map(t => `<tr><td>#${pad(t.numero)}</td><td>${dth(t.enviadoEm)}</td><td>${esc(lojaNome(t.origemId))}</td><td>${esc(lojaNome(t.destinoId))}</td><td><small>${t.aparelhos.length} aparelho(s)${t.produtos.length ? ', ' + soma(t.produtos, p => p.qtd) + ' acessório(s)/peça(s)' : ''}</small></td><td><span class="tag ${t.status === 'recebida' ? 'ok' : 'vio'}">${t.status === 'recebida' ? 'Recebida ' + dt(t.recebidoEm) : 'A caminho'}</span></td>
  <td class="r">${t.status === 'enviada' && lojasPermitidas().includes(t.destinoId) ? `<button class="btn sm ok" onclick="receberTransf('${t.id}',this)">Confirmar recebimento</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Nenhuma transferência ainda.</td></tr>'}</tbody></table></div>`);
};
function novaTransf(){
  if (precisaLoja()) return; const O = S.lojaId;
  const aps = D('aparelhos').filter(a => a.lojaId === O && a.status === 'disponivel'), prs = D('produtos').filter(p => p.ativo !== false && (p.estoque?.[O] || 0) > 0);
  openModal('Transferir de ' + esc(lojaNome(O)), `<form id="f-tr" onsubmit="event.preventDefault();enviarTransf(event.submitter)">
  <div class="f"><label>Loja de destino</label><select name="destino" required>${opts(D('lojas').filter(l => l.id !== O && l.ativa !== false), '')}</select></div>
  <h3 class="sub">Aparelhos</h3><div class="checks" style="grid-template-columns:1fr;max-height:200px;overflow:auto">${aps.map(a => `<label class="check"><input type="checkbox" name="ap_${a.id}"> ${esc(apNome(a))} <small class="mut">· ${esc(a.imei)}</small></label>`).join('') || '<span class="mut">Nenhum aparelho disponível.</span>'}</div>
  <h3 class="sub">Acessórios e peças (quantidade)</h3><div style="max-height:220px;overflow:auto">${prs.map(p => `<div class="row nw mb"><span class="sp">${esc(p.nome)} <small class="mut">(${p.estoque[O]} disp.)</small></span><input type="number" name="pr_${p.id}" min="0" max="${p.estoque[O]}" value="0" style="width:80px"></div>`).join('') || '<span class="mut">Nenhum item em estoque.</span>'}</div>
  <button class="btn pri big">Enviar transferência</button></form>`, {wide:true});
}
async function enviarTransf(btn){
  const f = form('f-tr'), O = S.lojaId;
  const apIds = Object.keys(f).filter(k => k.startsWith('ap_') && f[k]).map(k => k.slice(3));
  const prods = Object.keys(f).filter(k => k.startsWith('pr_') && parseInt(f[k]) > 0).map(k => { const p = byId('produtos', k.slice(3)); return {id:p.id, nome:p.nome, qtd:Math.min(parseInt(f[k]), p.estoque[O] || 0)}; }).filter(p => p.qtd > 0);
  if (!f.destino) return toast('Escolha o destino', 'warn'); if (!apIds.length && !prods.length) return toast('Selecione pelo menos um item', 'warn');
  if (btn) btn.disabled = true;
  for (const id of apIds){ const a = byId('aparelhos', id); await save('aparelhos', {...a, status:'em_transito'}); }
  for (const x of prods){ const p = byId('produtos', x.id); await save('produtos', {...p, estoque:{...p.estoque, [O]:(p.estoque[O] || 0) - x.qtd}}); }
  await save('transferencias', {numero:prox('transferencias'), origemId:O, destinoId:f.destino, aparelhos:apIds.map(id => ({id, nome:apNome(byId('aparelhos', id)), imei:byId('aparelhos', id).imei})), produtos:prods, status:'enviada', enviadoPor:S.user.uid, enviadoEm:Date.now()});
  closeModal(); toast('Transferência enviada'); render();
}
async function receberTransf(id, btn){
  const t = byId('transferencias', id); btn.disabled = true;
  for (const x of t.aparelhos){ const a = byId('aparelhos', x.id); if (a) await save('aparelhos', {...a, lojaId:t.destinoId, status:'disponivel'}); }
  for (const x of t.produtos){ const p = byId('produtos', x.id); if (p) await save('produtos', {...p, estoque:{...p.estoque, [t.destinoId]:(p.estoque?.[t.destinoId] || 0) + x.qtd}}); }
  await save('transferencias', {...t, status:'recebida', recebidoPor:S.user.uid, recebidoEm:Date.now()}); toast('Recebimento confirmado'); render();
}

async function salvarPref(){ const f = form('f-pref'); const config = {...cfg(), ...f}; ['garantiaNovo','garantiaSeminovo','garantiaAcessorio','garantiaOS'].forEach(k => config[k] = parseInt(config[k]) || 0); await B.update('empresas/' + S.empresa.id, {config}); S.empresa.config = config; toast('Preferências salvas'); }
function lojaModal(id){

}
async function salvarLoja(id){ const f = form('f-loja'), old = id ? byId('lojas', id) : {}; await save('lojas', {...old, id:id || undefined, nome:f.nome, telefone:f.telefone, cnpj:f.cnpj, endereco:f.endereco, ativa:id ? f.ativa : true}); closeModal(); toast('Loja salva'); render(); }
function usuarioModal(id){
  const u = id ? D('usuarios').find(x => x.id === id) : {papel:'vendedor', lojas:[S.lojaId === '*' ? lojasPermitidas()[0] : S.lojaId], ativo:true};
  const papeis = S.perfil.papel === 'dono' ? ['gerente','vendedor','tecnico'] : ['vendedor','tecnico'];
  openModal(id ? 'Editar ' + esc(u.nome) : 'Adicionar pessoa', `<form id="f-usr" onsubmit="event.preventDefault();salvarUsuario('${id || ''}',event.submitter)">
  <div class="f"><label>Nome *</label><input name="nome" value="${esc(u.nome)}" required></div>
  ${id ? '' : `<div class="fg"><div><label>E-mail de login *</label><input name="email" type="email" required></div><div><label>Senha inicial *</label><input name="senha" minlength="6" required></div></div>`}
  <div class="f"><label>Função</label><select name="papel">${papeis.map(p => `<option value="${p}" ${u.papel === p ? 'selected' : ''}>${PAPEL[p]}</option>`).join('')}</select></div>

  <button class="btn pri big">${id ? 'Salvar' : 'Criar acesso'}</button></form>`);

async function salvarUsuario(id, btn){
  const f = form('f-usr'); const lojas = f.todas ? 'todas' : D('lojas').filter(l => f['lj_' + l.id]).map(l => l.id);
  if (lojas !== 'todas' && !lojas.length) return toast('Marque pelo menos uma loja', 'warn');
  if (btn) btn.disabled = true;
  try {
    if (id){ const patch = {nome:f.nome, papel:f.papel, lojas, ativo:f.ativo}; await B.update('usuarios/' + id, patch); Object.assign(D('usuarios').find(u => u.id === id), patch); }
    else { const u = await B.criarConta(f.email.toLowerCase(), f.senha); const doc = {empresaId:S.empresa.id, nome:f.nome, email:f.email.toLowerCase(), papel:f.papel, lojas, ativo:true, criadoEm:Date.now()}; await B.set('usuarios/' + u, doc); S.data.usuarios.push({id:u, ...doc}); }
    closeModal(); toast(id ? 'Salvo' : 'Acesso criado — passe o e-mail e a senha para a pessoa'); render();
  } catch(e){ toast(errMsg(e), 'bad'); if (btn) btn.disabled = false; }
}

function renderAdmin(){

  ${lista.map(e => `<tr><td><b>${esc(e.nome)}</b><br><small>${esc(e.email)} · ${esc(e.telefone || '')} · desde ${dt(e.criadoEm)}</small></td>
  <td><select style="width:auto" onchange="admPlano('${e.id}',this.value)">${CONFIG.planos.map(p => `<option value="${p.id}" ${e.plano === p.id ? 'selected' : ''}>${p.nome} ${brl(p.preco)}</option>`).join('')}</select>${e.planoSolicitado ? `<br><small style="color:#fbbf24">pediu ${planoDe(e.planoSolicitado).nome}</small>` : ''}</td>

}
async function admUpd(id, patch){ try { await B.update('empresas/' + id, patch); Object.assign(S.adminEmps.find(e => e.id === id), patch); if (S.empresa?.id === id) Object.assign(S.empresa, patch); renderAdmin(); toast('Atualizado'); } catch(e){ toast(errMsg(e), 'bad'); } }
function admPago(id){ const e = S.adminEmps.find(x => x.id === id); const venc = Math.max(Date.now(), e.vencimento || 0) + 30 * DIA; admUpd(id, {vencimento:venc, status:'ativo', pagamentoInformadoEm:null, pagamentos:[...(e.pagamentos || []), {data:Date.now(), valor:planoDe(e.plano).preco, ate:venc}]}); }
function admBloq(id){ const e = S.adminEmps.find(x => x.id === id); admUpd(id, {status:e.status === 'bloqueado' ? 'ativo' : 'bloqueado'}); }
function admPlano(id, plano){ admUpd(id, {plano, planoSolicitado:null}); }
